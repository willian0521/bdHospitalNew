<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - Gestión Hospitalaria</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="registro-container">
        <h2>Registrar Nuevo Usuario</h2>
        <form id="registroForm">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group">
                <label for="rol">Rol:</label>
                <select id="rol" required>
                    <option value="recepcionista">Recepcionista</option>
                    <option value="medico">Médico</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>
            <button type="submit">Registrar</button>
        </form>
        <div id="mensaje"></div>
        <a href="index.html">Volver al inicio</a>
    </div>

    <script>
        const registroForm = document.getElementById('registroForm');
        const mensajeDiv = document.getElementById('mensaje');

        registroForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rol = document.getElementById('rol').value;

            const token = localStorage.getItem('token');

            try {
                const response = await fetch('http://localhost:5000/api/auth/registro', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ nombre, email, password, rol })
                });

                const data = await response.json();

                if (response.ok) {
                    mensajeDiv.textContent = 'Usuario registrado exitosamente';
                    mensajeDiv.style.color = 'green';
                    registroForm.reset();
                } else {
                    mensajeDiv.textContent = data.mensaje;
                    mensajeDiv.style.color = 'red';
                }
            } catch (error) {
                mensajeDiv.textContent = 'Error de conexión';
                mensajeDiv.style.color = 'red';
            }
        });
    </script>
</body>
</html>
