<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <style>
    .box { fill: #ffffff; stroke: #333333; stroke-width: 2; rx:10; }
    .title { font: bold 16px sans-serif; fill: #111111; }
    .attr { font: 13px sans-serif; fill: #222222; }
    .link { stroke: #555555; stroke-width: 2; }
    .fk { font: italic 12px sans-serif; fill: #555555; }
  </style>

  <!-- Usuario -->
  <rect x="40" y="40" width="260" height="140" class="box" />
  <text x="60" y="65" class="title">Usuario</text>
  <text x="60" y="90" class="attr">PK DNI</text>
  <text x="60" y="110" class="attr">Nombre</text>
  <text x="60" y="130" class="attr">Apellido</text>
  <text x="60" y="150" class="attr">Rol, TipoMedico</text>
  <text x="200" y="90" class="attr">CodigoEmpleado (UNQ)</text>

  <!-- Paciente -->
  <rect x="40" y="220" width="260" height="140" class="box" />
  <text x="60" y="245" class="title">Paciente</text>
  <text x="60" y="270" class="attr">PK DNI</text>
  <text x="60" y="290" class="attr">Nombre</text>
  <text x="60" y="310" class="attr">Apellido</text>
  <text x="60" y="330" class="attr">FechaNacimiento, Direccion</text>

  <!-- Expediente -->
  <rect x="380" y="120" width="300" height="190" class="box" />
  <text x="400" y="145" class="title">Expediente</text>
  <text x="400" y="170" class="attr">PK IdExpediente</text>
  <text x="400" y="190" class="attr">FK DNI (Paciente)</text>
  <text x="400" y="210" class="attr">FK CodigoEmpleado (Usuario)</text>
  <text x="400" y="230" class="attr">FechaRegistro, Estado, Urgencia</text>
  <text x="400" y="250" class="attr">MotivoConsulta, FechaCierre</text>

  <!-- Tratamiento -->
  <rect x="740" y="120" width="220" height="140" class="box" />
  <text x="760" y="145" class="title">Tratamiento</text>
  <text x="760" y="170" class="attr">PK IdTratamiento</text>
  <text x="760" y="190" class="attr">FK IdExpediente</text>
  <text x="760" y="210" class="attr">FK CodigoEmpleado (Usuario)</text>
  <text x="760" y="230" class="attr">Diagnostico, Tratamiento, FechaRegistro</text>

  <!-- Relaciones (líneas) -->
  <!-- Paciente 1..* -> Expediente -->
  <line x1="300" y1="260" x2="380" y2="200" class="link" />
  <text x="330" y="245" class="fk">1..* (Paciente &gt; Expediente)</text>

  <!-- Usuario (crea expediente) -->
  <line x1="300" y1="100" x2="380" y2="170" class="link" />
  <text x="330" y="130" class="fk">1..* (Usuario &gt; Expediente)</text>

  <!-- Expediente 1..* -> Tratamiento -->
  <line x1="680" y1="190" x2="740" y2="190" class="link" />
  <text x="690" y="175" class="fk">1..* (Expediente &gt; Tratamiento)</text>

  <!-- Usuario (realiza tratamiento) -->
  <line x1="300" y1="120" x2="740" y2="160" class="link" stroke-dasharray="4 3" />
  <text x="420" y="135" class="fk">1..* (Usuario &gt; Tratamiento)</text>

</svg>
